
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漫趣 V1.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://img.baidu.re/i/2026/02/3xfmyu.jpg" type="image/png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;background:#f5f8fa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#2c3e50;overflow-x:hidden;transition:background .3s ease,color .3s ease}
        body.dark-mode{background:#121212;color:#e0e0e0}
        .dark-mode .login-container{background:#1e1e1e;box-shadow:0 10px 30px rgba(0,0,0,.3)}
        .dark-mode .main-title,.dark-mode .app-title,.dark-mode .user-name,.dark-mode .post-title{color:#e0e0e0}
        .dark-mode .sub-title,.dark-mode .post-time,.dark-mode .post-text,.dark-mode .post-stat{color:#b0b0b0}
        .dark-mode .input-group input{background:#2d2d2d;border-color:#444;color:#e0e0e0}
        .dark-mode .input-group input:focus{border-color:#4da6ff;box-shadow:0 0 0 3px rgba(77,166,255,.2)}
        .dark-mode .post-card,.dark-mode .app-header,.dark-mode .post-detail-container,.dark-mode .app-footer{background:#1e1e1e;box-shadow:0 3px 10px rgba(0,0,0,.3)}
        .dark-mode .settings-container{color:#e0e0e0}
        .login-container{width:100%;max-width:500px;background:#fff;border-radius:15px;padding:30px;text-align:center;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.1);transition:transform .4s ease,opacity .4s ease}
        .logo-container{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:25px}
        .logo{width:70px;height:70px;border-radius:18px;overflow:hidden;border:2px solid #fff;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4da6ff,#5ce1e6);color:#fff;font-size:32px;font-weight:700;transition:all .5s cubic-bezier(.68,-.55,.265,1.55)}
        .logo img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
        .title-container{text-align:left;flex:1}
        .main-title{font-size:1.8rem;color:#2c3e50;font-weight:700;padding-bottom:4px;position:relative}
        .main-title:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:#4da6ff}
        .sub-title{font-size:.9rem;color:#7f8c8d;text-align:right;padding-top:4px}
        .login-section{margin:20px 0;padding:25px}
        .input-group{margin-bottom:20px;position:relative}
        .input-group label{display:block;margin-bottom:8px;font-size:.95rem;color:#555;font-weight:500;text-align:left}
        .dark-mode .input-group label{color:#b0b0b0}
        .input-group input{width:100%;padding:14px 16px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;transition:all .3s;background:#fff}
        .input-group input:focus{border-color:#4da6ff;box-shadow:0 0 0 3px rgba(77,166,255,.1);outline:none}
        .password-wrapper{position:relative}
        .toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0 0;border:none;color:#7f8c8d;cursor:pointer}
        .dark-mode .toggle-password{color:#b0b0b0}
        .remember-forgot{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:-10px;margin-bottom:20px}
        .remember-me{display:flex;align-items:center;gap:5px}
        .dark-mode .remember-me{color:#b0b0b0}
        .remember-me input{accent-color:#4da6ff}
        .forgot-password{color:#3498db;text-decoration:none;transition:color .2s}
        .forgot-password:hover{color:#1a6ca0;text-decoration:underline}
        .btn{display:block;width:100%;padding:14px;background:linear-gradient(90deg,#4da6ff,#5ce1e6);color:#fff;font-size:1.05rem;font-weight:600;border:none;border-radius:10px;margin:15px 0 20px;text-decoration:none;text-align:center;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden}
        .btn:hover{background:linear-gradient(90deg,#3d96ef,#4cd1d6)}
        .btn:after{content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;background:rgba(255,255,255,.5);opacity:0;border-radius:100%;transform:scale(1,1) translate(-50%);transform-origin:50% 50%}
        .btn:focus:not(:active):after{animation:ripple 1s ease-out}
        @keyframes ripple{0%{transform:scale(0,0);opacity:.5}100%{transform:scale(20,20);opacity:0}}
        .register-link{margin-top:20px;font-size:.95rem;color:#555;text-align:center}
        .dark-mode .register-link{color:#b0b0b0}
        .register-link a{color:#3498db;text-decoration:none;font-weight:500;transition:color .2s}
        .register-link a:hover{color:#1a6ca0;text-decoration:underline}
        .footer{width:100%;max-width:500px;margin-top:15px;text-align:center;padding:15px;font-size:.85rem;color:#666}
        .dark-mode .footer{color:#b0b0b0}
        .footer-links{margin-top:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
        .footer-link{color:#3498db;text-decoration:none}
        .unofficial-notice{font-size:.8rem;color:#7f8c8d;margin-top:5px;padding-top:10px;border-top:1px solid #eee}
        .dark-mode .unofficial-notice{color:#888;border-top:1px solid #333}
        .app-container{display:none;width:100%;height:100vh;background:#f0f4f8;flex-direction:column;position:fixed;top:0;left:0;z-index:10}
        .dark-mode .app-container{background:#121212}
        .app-header{display:flex;align-items:center;padding:15px 20px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);position:relative;z-index:2;cursor:pointer}
        .dark-mode .app-header{background:#1e1e1e}
        .app-logo{width:40px;height:40px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4da6ff,#5ce1e6);color:#fff;font-weight:700;font-size:20px}
        .app-logo img{width:100%;height:100%;object-fit:cover}
        .app-title{font-size:1.2rem;font-weight:700;color:#2c3e50;margin-left:15px;flex-grow:1}
        .dark-mode .app-title{color:#e0e0e0}
        .header-buttons{display:flex;gap:10px}
        .search-btn,.checkin-btn,.new-post-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4da6ff,#5ce1e6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 3px 6px rgba(77,166,255,.3);transition:all .2s}
        .app-content{flex:1;overflow-y:auto;padding:20px;background:#f8fafc;position:relative}
        .dark-mode .app-content{background:#121212}
        .post-list{display:grid;grid-template-columns:1fr;gap:15px}
        .post-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 10px rgba(0,0,0,.05);transition:transform .2s ease,box-shadow .2s ease;cursor:pointer}
        .post-card:hover{transform:translateY(-3px);box-shadow:0 5px 15px rgba(0,0,0,.08)}
        .post-header{display:flex;align-items:center;margin-bottom:15px}
        .user-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;margin-right:12px;background:#e9ecef;display:flex;align-items:center;justify-content:center;color:#4da6ff;font-weight:700}
        .dark-mode .user-avatar{background:#2d2d2d}
        .user-avatar img{width:100%;height:100%;object-fit:cover}
        .user-info{flex:1}
        .user-name{font-weight:600;color:#2c3e50;margin-bottom:3px}
        .post-time{font-size:.8rem;color:#7f8c8d}
        .post-content{margin-bottom:15px}
        .post-title{font-weight:700;font-size:1.1rem;margin-bottom:10px;color:#2c3e50}
        .dark-mode .post-title{color:#e0e0e0}
        .post-text{font-size:.95rem;color:#555;line-height:1.5;word-break:break-word;overflow-wrap:break-word}
        .dark-mode .post-text{color:#b0b0b0}
        .post-footer{display:flex;justify-content:space-between;padding-top:15px;border-top:1px solid #f0f0f0;font-size:.9rem;color:#7f8c8d}
        .dark-mode .post-footer{border-top:1px solid #333}
        .post-stats{display:flex;gap:15px}
        .post-stat{display:flex;align-items:center;gap:5px}
        .post-tag{background:#e6f2ff;color:#4da6ff;padding:4px 10px;border-radius:20px;font-size:.8rem}
        .dark-mode .post-tag{background:rgba(77,166,255,.15)}
        .app-footer{display:flex;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.05);padding:10px 0;position:relative;z-index:2}
        .dark-mode .app-footer{background:#1e1e1e}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;color:#7f8c8d;font-size:.8rem;transition:color .2s,transform .3s ease;cursor:pointer;position:relative}
        .dark-mode .nav-item{color:#b0b0b0}
        .nav-item.active{color:#4da6ff}
        .nav-item i{font-size:1.2rem;margin-bottom:5px;transition:all .3s ease}
        .settings-container{display:none;padding:20px;text-align:center}
        .settings-logo{width:100px;height:100px;border-radius:20px;overflow:hidden;margin:0 auto 20px;background:linear-gradient(135deg,#4da6ff,#5ce1e6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:700}
        .settings-logo img{width:100%;height:100%;object-fit:cover}
        .version-info{font-size:1rem;color:#7f8c8d;margin:10px 0 30px}
        .dark-mode .version-info{color:#b0b0b0}
        .settings-section{background:#f8fafc;border-radius:12px;padding:20px;margin-bottom:20px;text-align:left}
        .dark-mode .settings-section{background:#2d2d2d}
        .settings-title{font-size:1.1rem;font-weight:600;margin-bottom:15px;color:#2c3e50;display:flex;align-items:center;gap:10px}
        .dark-mode .settings-title{color:#e0e0e0}
        .dark-mode-toggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
        .dark-mode-text{flex:1;font-weight:500;color:#2c3e50}
        .dark-mode .dark-mode-text{color:#e0e0e0}
        .dark-mode-toggle .toggle-switch{position:relative;width:50px;height:26px;background:#ccc;border-radius:13px;transition:background .3s}
        .dark-mode-toggle .toggle-switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
        .dark-mode-toggle.active .toggle-switch{background:#4da6ff}
        .dark-mode-toggle.active .toggle-switch:after{transform:translateX(24px)}
        .logout-btn{display:block;width:100%;padding:14px;background:linear-gradient(90deg,#ff6b6b,#ff8787);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;margin-top:20px;cursor:pointer;transition:all .3s}
        .logout-btn:hover{background:linear-gradient(90deg,#ff5252,#ff6b6b);box-shadow:0 3px 10px rgba(255,107,107,.3)}
        #toast-container{position:fixed;top:20px;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:10000;pointer-events:none}
        .toast{background-color:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;margin-bottom:10px;animation:toast-in .5s ease forwards,toast-out .5s ease 1.2s forwards;max-width:80%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
        @keyframes toast-in{from{transform:translateY(-100px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes toast-out{from{transform:translateY(0);opacity:1}to{transform:translateY(-100px);opacity:0}}
        .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
        .modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:400px;text-align:center}
        .dark-mode .modal-content{background:#1e1e1e;color:#e0e0e0}
        .modal-message{margin-bottom:20px;font-size:1rem}
        .modal-btn{padding:8px 16px;background:#4da6ff;color:#fff;border:none;border-radius:6px;cursor:pointer}
        .load-more{text-align:center;padding:15px;color:#7f8c8d}
        .dark-mode .load-more{color:#b0b0b0}
        .loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(77,166,255,.3);border-radius:50%;border-top-color:#4da6ff;animation:spin 1s ease-in-out infinite;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .hidden-inputs{position:absolute;top:-100px;left:-100px;height:0;width:0;overflow:hidden}
        .post-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
        .post-modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative}
        .dark-mode .post-modal-content{background:#1e1e1e;color:#e0e0e0}
        .post-modal-title{font-size:1.2rem;font-weight:600;margin-bottom:15px;text-align:left}
        .post-modal-close{position:absolute;top:15px;right:15px;background:0 0;border:none;font-size:1.2rem;cursor:pointer;color:#7f8c8d}
        .post-modal-section{margin-bottom:15px}
        .post-modal-label{display:block;margin-bottom:5px;font-weight:500}
        .post-modal-select,.post-modal-input,.post-modal-textarea{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;font-size:14px;background:#fff;color:#2c3e50}
        .dark-mode .post-modal-select,.dark-mode .post-modal-input,.dark-mode .post-modal-textarea{background:#2d2d2d;border-color:#444;color:#e0e0e0}
        .post-modal-textarea{min-height:100px;resize:vertical}
        .post-modal-buttons{display:flex;justify-content:space-between;margin-top:20px}
        .post-modal-btn{padding:10px 20px;border-radius:6px;border:none;cursor:pointer;font-weight:500}
        .post-modal-cancel{background:#f0f0f0;color:#555;display:flex;align-items:center;gap:8px}
        .dark-mode .post-modal-cancel{background:#333;color:#e0e0e0}
        .post-modal-submit{background:linear-gradient(90deg,#4da6ff,#5ce1e6);color:#fff}
        .post-detail-container{display:none;padding:15px;overflow-y:auto}
        .post-detail-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 10px rgba(0,0,0,.05);margin-bottom:15px}
        .dark-mode .post-detail-card{background:#1e1e1e}
        .post-detail-header{display:flex;align-items:center;margin-bottom:15px}
        .post-detail-content{margin-bottom:15px}
        .post-detail-footer{display:flex;justify-content:space-between;padding-top:15px;border-top:1px solid #f0f0f0;font-size:.9rem;color:#7f8c8d}
        .dark-mode .post-detail-footer{border-top:1px solid #333}
        .post-detail-stats{display:flex;gap:15px}
        .post-detail-stat{display:flex;align-items:center;gap:5px}
        .post-detail-tag{background:#e6f2ff;color:#4da6ff;padding:4px 10px;border-radius:20px;font-size:.8rem}
        .dark-mode .post-detail-tag{background:rgba(77,166,255,.15)}
        .comment-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
        .comment-modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
        .dark-mode .comment-modal-content{background:#1e1e1e;color:#e0e0e0}
        .comment-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .comment-modal-title{font-size:1.2rem;font-weight:600}
        .comment-modal-close{background:0 0;border:none;font-size:1.5rem;cursor:pointer;color:#7f8c8d}
        .comment-modal-body{max-height:60vh;overflow-y:auto}
        .comment-list{display:grid;grid-template-columns:1fr;gap:15px;margin-bottom:20px}
        .comment-card{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
        .dark-mode .comment-card{background:#1e1e1e}
        .comment-header{display:flex;align-items:center;margin-bottom:10px}
        .comment-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;margin-right:10px;background:#e9ecef;display:flex;align-items:center;justify-content:center;color:#4da6ff;font-weight:700;font-size:14px}
        .dark-mode .comment-avatar{background:#2d2d2d}
        .comment-avatar img{width:100%;height:100%;object-fit:cover}
        .comment-info{flex:1}
        .comment-user{font-weight:600;font-size:.9rem;color:#2c3e50;margin-bottom:2px}
        .dark-mode .comment-user{color:#e0e0e0}
        .comment-time{font-size:.75rem;color:#7f8c8d}
        .comment-content{font-size:.9rem;color:#555;line-height:1.4;word-break:break-word;overflow-wrap:break-word}
        .dark-mode .comment-content{color:#b0b0b0}
        .comment-image-container{position:relative;margin-top:8px}
        .comment-image{max-width:100%;border-radius:6px;cursor:pointer}
        .comment-image-error{text-align:center;padding:10px;color:#7f8c8d;font-size:.8rem;background:#f8f9fa;border-radius:6px}
        .dark-mode .comment-image-error{background:#2d2d2d;color:#b0b0b0}
        .comment-form{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
        .dark-mode .comment-form{background:#1e1e1e}
        .comment-form-title{font-size:1rem;font-weight:600;margin-bottom:10px;color:#2c3e50}
        .dark-mode .comment-form-title{color:#e0e0e0}
        .comment-form-textarea{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;font-size:14px;background:#fff;color:#2c3e50;min-height:80px;resize:vertical;margin-bottom:10px}
        .dark-mode .comment-form-textarea{background:#2d2d2d;border-color:#444;color:#e0e0e0}
        .comment-form-input{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;font-size:14px;background:#fff;color:#2c3e50;margin-bottom:10px}
        .dark-mode .comment-form-input{background:#2d2d2d;border-color:#444;color:#e0e0e0}
        .comment-form-buttons{display:flex;justify-content:space-between}
        .comment-form-btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:500}
        .comment-form-cancel{background:#f0f0f0;color:#555}
        .dark-mode .comment-form-cancel{background:#333;color:#e0e0e0}
        .comment-form-submit{background:linear-gradient(90deg,#4da6ff,#5ce1e6);color:#fff}
        .post-actions{display:flex;justify-content:center;gap:20px;margin:20px 0}
        .post-action-btn{padding:10px 20px;border-radius:8px;border:none;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .3s}
        .like-btn{background:#ff6b6b;color:#fff}
        .comment-btn{background:#4da6ff;color:#fff}
        .post-detail-header-bar{display:flex;align-items:center;padding:10px 0;margin-bottom:15px}
        .back-btn{background:0 0;border:none;font-size:1.2rem;cursor:pointer;color:#4da6ff;margin-right:15px;position:fixed;top:10px;left:10px;z-index:10}
        .post-image{max-width:100%;border-radius:8px;margin-top:10px;cursor:pointer;transition:transform .2s}
        .post-image:hover{transform:scale(1.02)}
        .image-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:1200;align-items:center;justify-content:center}
        .image-modal img{max-width:90%;max-height:90%}
        .image-modal-close{position:absolute;top:20px;right:20px;color:#fff;font-size:30px;cursor:pointer}
        .login-status{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:15px;z-index:10}
        .dark-mode .login-status{background:rgba(30,30,30,.9)}
        .login-status i{font-size=2rem;margin-bottom:15px;color:#4da6ff}
        .login-status p{font-size:1.1rem;font-weight:500}
        .reply-btn{background:0 0;border:none;color:#4da6ff;cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:4px;transition:background .2s}
        .reply-btn:hover{background:rgba(77,166,255,.1)}
        .dark-mode .reply-btn{color:#5ce1e6}
        .reply-info{color:#4da6ff;font-size:.85rem;margin-bottom:5px}
        .dark-mode .reply-info{color:#5ce1e6}
        #communityIcon{transition:all .3s ease}
        .dark-mode .loading-spinner{border-color:rgba(77,166,255,.3);border-top-color:#4da6ff}
        .dark-mode .detail-loading-overlay{background:rgba(30,30,30,.9);color:#e0e0e0}
        .load-more-comments{text-align:center;padding:15px;color:#7f8c8d;display:none}
        .dark-mode .load-more-comments{color:#b0b0b0}
        .ranking-container{display:none;padding:15px;overflow-y:auto}
        .ranking-fixed-header{position:fixed;top:0;left:0;right:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);z-index:3;display:flex;align-items:center;padding:15px 20px;transform:translateY(-100%);transition:transform .3s ease}
        .dark-mode .ranking-fixed-header{background:#1e1e1e;box-shadow:0 2px 10px rgba(0,0,0,.3)}
        .ranking-fixed-header.show{transform:translateY(0)}
        .ranking-fixed-header .app-logo{width:40px;height:40px;border-radius:10px;font-size:20px}
        .ranking-title{font-size=1.2rem;font-weight:700;color:#2c3e50;margin-left:15px;flex-grow:1}

    <script>
        const base_url = 'http://apk.xiaoqu.online/api';
        let currentPage = 1;
        let hasMorePosts = true;
        let isLoading = false;
        let userToken = null;
        let userCredentials = null;
        let currentPostId = null;
        let isLoadingComments = false;
        let currentCommentPage = 1;
        let hasMoreComments = true;
        let lastPostContent = null;
        let isScrolling = false;
        let replyingTo = null;
        let isScrolled = false;
        let lastCommunityScroll = 0;
        let lastSettingsScroll = 0;
        let lastRankingScroll = 0;
        let lastRankingTypeScroll = { money: 0, exp: 0 };
        let isRestoreMode = false;
        let isEventBindingsSetup = false;
        let isCommunityPageActive = true;
        let commentScrollTimeout = null;
        let postScrollTimeout = null;
        let rankingScrollTimeout = null;
        let currentRankingType = 'money';
        let isRankingLoading = false;
        let currentRankingPage = 1;
        let hasMoreRanking = true;
        let rankingLoaded = { money: false, exp: false };
        
        let currentSearchKeyword = '';
        let isSearching = false;
        let currentSearchPage = 1;
        let hasMoreSearchResults = true;
        let isInSearchMode = false;
        let currentSearchPageCount = 1;
        let isSearchBarVisible = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            const savedCredentials = localStorage.getItem('autoLoginData');
            if (savedCredentials) {
                userCredentials = JSON.parse(savedCredentials);
                showLoginStatus();
                autoLogin();
            }
            const savedToken = localStorage.getItem('userToken');
            if (savedToken) {
                userToken = savedToken;
            }
            const savedPostContent = localStorage.getItem('lastPostContent');
            if (savedPostContent) {
                lastPostContent = JSON.parse(savedPostContent);
            }
            checkAutoLogin();
            setupEventBindings();
            initDarkMode();
        });
        
        function showLoginStatus() {
            const loginContainer = document.getElementById('loginContainer');
            if (document.getElementById('loginStatus')) return;
            const statusDiv = document.createElement('div');
            statusDiv.className = 'login-status';
            statusDiv.id = 'loginStatus';
            statusDiv.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                <p>登录中，请稍候...</p>
            `;
            loginContainer.appendChild(statusDiv);
        }
        
        function hideLoginStatus() {
            const statusDiv = document.getElementById('loginStatus');
            if (statusDiv) statusDiv.remove();
        }
        
        function handleImageError(img) {
            const logoDiv = img.parentElement;
            logoDiv.style.display = 'flex';
            logoDiv.style.alignItems = 'center';
            logoDiv.style.justifyContent = 'center';
            logoDiv.style.fontSize = logoDiv.classList.contains('settings-logo') ? '40px' : '32px';
            logoDiv.style.fontWeight = 'bold';
            logoDiv.style.color = 'white';
            logoDiv.textContent = '趣';
            img.style.display = 'none';
        }
        
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.prepend(toast);
            setTimeout(() => {
                toast.style.animation = 'toast-out 0.5s ease forwards';
                setTimeout(() => { toast.remove(); }, 500);
            }, 1200);
        }
        
        function showModal(message) {
            const modal = document.getElementById('modal');
            const modalMessage = document.getElementById('modalMessage');
            const modalBtn = document.getElementById('modalBtn');
            modalMessage.textContent = message;
            modal.style.display = 'flex';
            modalBtn.onclick = function() { modal.style.display = 'none'; };
        }
        
        async function loginAPI(username, password) {
            try {
                const response = await fetch(`${base_url}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ appid: '1', username: username, password: password })
                });
                const data = await response.json();
                if (data.code === 1) {
                    const tokenFromData = data.data?.token || data.data?.usertoken || data.data?.user_token || data.data?.userToken || data.data?.access_token;
                    if (tokenFromData) {
                        return { success: true, token: tokenFromData, data: data.data };
                    } else {
                        throw new Error('登录成功但未获取到token');
                    }
                } else {
                    throw new Error(data.msg || '网络异常');
                }
            } catch (error) {
                throw new Error('网络异常');
            }
        }
        
        async function autoLogin() {
            if (!userCredentials) return;
            try {
                const response = await loginAPI(userCredentials.username, userCredentials.password);
                if (response.success) {
                    userToken = response.token;
                    if (userToken) {
                        localStorage.setItem('userToken', userToken);
                        hideLoginStatus();
                        document.getElementById('loginContainer').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'flex';
                        initApp();
                    } else {
                        throw new Error('登录返回缺少 token');
                    }
                }
            } catch (error) {
                hideLoginStatus();
                showToast('自动登录失败: 网络异常');
                localStorage.removeItem('autoLoginData');
                localStorage.removeItem('userToken');
                userCredentials = null; userToken = null;
            }
        }
        
        async function getPosts(page = 1, keyword = '') {
            if (isLoading) return { posts: [], hasMore: false, pagecount: 1, current_number: 1 };
            isLoading = true;
            try {
                let url = `${base_url}/get_posts_list`;
                const params = new URLSearchParams({
                    appid: '1',
                    limit: '6',
                    page: page.toString(),
                    sortOrder: 'desc',
                    sort: 'create_time'
                });
                
                if (keyword) {
                    params.append('keyword', keyword);
                }
                
                const response = await fetch(`${url}?${params.toString()}`);
                const data = await response.json();
                if (data.code === 1) {
                    return { 
                        posts: data.data.list || [], 
                        hasMore: data.data.pagecount > page,
                        pagecount: data.data.pagecount || 1,
                        current_number: data.data.current_number || page
                    };
                } else {
                    throw new Error(data.msg || '网络异常');
                }
            } catch (error) {
                showToast('网络异常');
                return { posts: [], hasMore: false, pagecount: 1, current_number: 1 };
            } finally {
                isLoading = false;
            }
        }
        
        async function getPostDetail(postid) {
            try {
                const response = await fetch(`${base_url}/get_post_information`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ appid: '1', postid: postid.toString() })
                });
                const data = await response.json();
                if (data.code === 1) {
                    return data.data;
                } else {
                    throw new Error(data.msg || '网络异常');
                }
            } catch (error) {
                throw new Error('网络异常');
            }
        }
        
        async function getComments(postid, page = 1) {
            try {
                const response = await fetch(`${base_url}/get_list_comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ appid: '1', postid: postid.toString(), limit: '10', page: page.toString() })

            try {

                });

        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const appContent = document.getElementById('appContent');
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    const page = this.getAttribute('data-page');
                    const appContent = document.getElementById('appContent');
                    if (isScrolled && page !== 'community') {
                        toggleCommunityIcon(false);
                    }
                    if (isCommunityPageActive) {
                        lastCommunityScroll = appContent.scrollTop || 0;
                    } else if (page === 'ranking') {
                        lastRankingScroll = appContent.scrollTop || 0;
                        lastRankingTypeScroll[currentRankingType] = appContent.scrollTop || 0;
                    } else {
                        lastSettingsScroll = appContent.scrollTop || 0;
                    }
                    if (page === 'community') {
                        if (document.getElementById('postDetailPage').style.display === 'block') {
                            backToCommunity();
                        } else {
                            document.getElementById('communityPage').style.display = 'block';
                            document.getElementById('postDetailPage').style.display = 'none';
                            document.getElementById('rankingPage').style.display = 'none';
                            document.getElementById('settingsPage').style.display = 'none';
                            document.getElementById('appHeader').style.display = 'flex';
                            document.getElementById('rankingFixedHeader').classList.remove('show');
                            document.getElementById('appFooter').style.display = 'flex';
                            if (isCommunityPageActive) {
                                const currentScroll = appContent.scrollTop || 0;
                                if (currentScroll > 0) {
                                    appContent.scrollTop = 0;
                                    toggleCommunityIcon(false);
                                } else {
                                    refreshCommunity();
                                }
                            } else {
                                setTimeout(() => {
                                    appContent.scrollTop = lastCommunityScroll || 0;
                                    toggleCommunityIcon(lastCommunityScroll > 200);
                                }, 10);
                            }
                            isCommunityPageActive = true;
                        }
                    } else if (page === 'ranking') {
                        const rankingPage = document.getElementById('rankingPage');
                        if (rankingPage.style.display === 'block') {
                            const currentScroll = appContent.scrollTop || 0;
                            if (currentScroll > 0) {
                                appContent.scrollTop = 0;
                            } else {
                                refreshRanking();
                            }
                            return;
                        }
                        document.getElementById('communityPage').style.display = 'none';
                        document.getElementById('postDetailPage').style.display = 'none';
                        document.getElementById('rankingPage').style.display = 'block';
                        document.getElementById('settingsPage').style.display = 'none';
                        document.getElementById('appHeader').style.display = 'none';
                        document.getElementById('rankingFixedHeader').classList.add('show');
                        document.getElementById('appFooter').style.display = 'flex';
                        isCommunityPageActive = false;
                        const rankingToggleBtn = document.getElementById('rankingToggleBtn');
                        const rankingTitle = document.getElementById('rankingTitle');
                        rankingToggleBtn.textContent = currentRankingType === 'money' ? '切换经验榜' : '切换金币榜';
                        rankingTitle.textContent = (currentRankingType === 'money' ? '金币' : '经验') + '排行榜';
                        if (!rankingLoaded[currentRankingType]) {
                            loadRankingList(currentRankingType);
                            rankingLoaded[currentRankingType] = true;
                        } else {
                            setTimeout(() => {
                                appContent.scrollTop = lastRankingTypeScroll[currentRankingType] || 0;
                            }, 10);
                        }
                    } else if (page === 'settings') {
                        document.getElementById('communityPage').style.display = 'none';
                        document.getElementById('postDetailPage').style.display = 'none';
                        document.getElementById('rankingPage').style.display = 'none';
                        document.getElementById('settingsPage').style.display = 'block';
                        document.getElementById('appHeader').style.display = 'none';
                        document.getElementById('rankingFixedHeader').classList.remove('show');
                        document.getElementById('appFooter').style.display = 'flex';
                        isCommunityPageActive = false;
                        setTimeout(() => {
                            appContent.scrollTop = lastSettingsScroll || 0;
                        }, 10);
                    }
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }
        
        function toggleCommunityIcon(scrolled) {
            if (!isCommunityPageActive) return;
            const communityNavItem = document.getElementById('communityNavItem');
            const icon = document.getElementById('communityIcon');
            if (scrolled && !isScrolled) {
                communityNavItem.classList.add('scrolled');
                icon.className = 'fas fa-arrow-up';
                isScrolled = true;
            } else if (!scrolled && isScrolled) {
                communityNavItem.classList.remove('scrolled');
                icon.className = 'fas fa-users';
                isScrolled = false;
            }
        }
        
        function setupPostScrollLoading() {
            const appContent = document.getElementById('appContent');
            const loadMore = document.getElementById('loadMore');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            function checkPostScroll() {
                if (isLoading || document.getElementById('communityPage').style.display !== 'block') return;
                const scrollTop = appContent.scrollTop;
                const scrollHeight = appContent.scrollHeight;
                const clientHeight = appContent.clientHeight;
                if (scrollTop + clientHeight >= scrollHeight - 100) {
                    loadMorePosts();
                }
            }
            
            function loadMorePosts() {
                if (isLoading) return;
                
                if (isInSearchMode) {
                    if (!hasMoreSearchResults || currentSearchPage >= currentSearchPageCount) {
                        showToast('没有更多搜索结果了');
                        return;
                    }
                    
                    loadMoreBtn.style.display = 'none';
                    loadMore.style.display = 'block';
                    currentSearchPage++;
                    
                    searchPosts(currentSearchKeyword, currentSearchPage).then(({ posts, hasMore, pagecount, current_number }) => {
                        currentSearchPageCount = pagecount;
                        if (posts.length > 0) {
                            renderPosts(posts, true);
                            hasMoreSearchResults = hasMore;
                        } else {
                            hasMoreSearchResults = false;
                        }
                        
                        if (currentSearchPage >= currentSearchPageCount) {
                            hasMoreSearchResults = false;
                            showToast('没有更多搜索结果了');
                        }
                    }).catch(err => {
                        showToast('网络异常');
                        currentSearchPage--;
                    }).finally(() => {
                        loadMore.style.display = 'none';
                        if (hasMoreSearchResults) {
                            loadMoreBtn.style.display = 'block';
                        }
                        isLoading = false;
                    });
                } else {
                    if (!hasMorePosts) return;
                    loadMoreBtn.style.display = 'none';
                    loadMore.style.display = 'block';
                    currentPage++;
                    
                    getPosts(currentPage).then(({ posts, hasMore }) => {
                        if (posts.length > 0) {
                            renderPosts(posts, true);
                            hasMorePosts = hasMore;
                        } else {
                            hasMorePosts = false;
                        }
                    }).catch(err => {
                        showToast('网络异常');
                        currentPage--;
                    }).finally(() => {
                        loadMore.style.display = 'none';
                        if (hasMorePosts) {
                            loadMoreBtn.style.display = 'block';
                        }
                        isLoading = false;
                    });
                }
            }
            
            loadMoreBtn.addEventListener('click', loadMorePosts);
            appContent.addEventListener('scroll', function() {
                const scrollTop = appContent.scrollTop;
                if (isCommunityPageActive) {
                    if (scrollTop > 200 && !isScrolled) toggleCommunityIcon(true);
                    else if (scrollTop <= 200 && isScrolled) toggleCommunityIcon(false);
                }
                clearTimeout(postScrollTimeout);
                postScrollTimeout = setTimeout(checkPostScroll, 100);
            });
            setTimeout(checkPostScroll, 500);
            setTimeout(() => { appContent.dispatchEvent(new Event('scroll')); }, 1000);
        }
        
        function setupCommentScrollLoading() {
            const appContent = document.getElementById('appContent');
            const loadMoreComments = document.getElementById('loadMoreComments');
            const loadMoreCommentsBtn = document.getElementById('loadMoreCommentsBtn');
            
            function checkCommentScroll() {
                if (isLoadingComments || !hasMoreComments || document.getElementById('postDetailPage').style.display !== 'block') return;
                const scrollTop = appContent.scrollTop;
                const scrollHeight = appContent.scrollHeight;
                const clientHeight = appContent.clientHeight;
                if (scrollTop + clientHeight >= scrollHeight - 100) {
                    loadMoreCommentsFunc();
                }
            }
            
            function loadMoreCommentsFunc() {
                if (isLoadingComments || !hasMoreComments) return;
                loadMoreCommentsBtn.style.display = 'none';
                loadMoreComments.style.display = 'block';
                isLoadingComments = true;
                currentCommentPage++;
                getComments(currentPostId, currentCommentPage).then(({ comments, hasMore }) => {
                    if (comments.length > 0) {
                        renderComments(comments, true);
                        hasMoreComments = hasMore;
                    } else {
                        hasMoreComments = false;
                    }
                }).catch(err => {
                    showToast('网络异常');
                    currentCommentPage--;
                }).finally(() => {
                    loadMoreComments.style.display = 'none';
                    if (hasMoreComments) {
                        loadMoreCommentsBtn.style.display = 'block';
                    }
                    isLoadingComments = false;
                });
            }
            
            loadMoreCommentsBtn.addEventListener('click', loadMoreCommentsFunc);
            appContent.addEventListener('scroll', function() {
                clearTimeout(commentScrollTimeout);
                commentScrollTimeout = setTimeout(checkCommentScroll, 150);
            });
        }
        
        function setupRankingScrollLoading() {
            const appContent = document.getElementById('appContent');
            const rankingLoadMore = document.getElementById('rankingLoadMore');
            const loadMoreRankingBtn = document.getElementById('loadMoreRankingBtn');
            
            function checkRankingScroll() {
                if (isRankingLoading || !hasMoreRanking || document.getElementById('rankingPage').style.display !== 'block') return;
                const scrollTop = appContent.scrollTop;
                const scrollHeight = appContent.scrollHeight;
                const clientHeight = appContent.clientHeight;
                if (scrollTop + clientHeight >= scrollHeight - 100) {
                    loadMoreRanking();
                }
            }
            
            function loadMoreRanking() {
                if (isRankingLoading || !hasMoreRanking) return;
                loadMoreRankingBtn.style.display = 'none';
                rankingLoadMore.style.display = 'block';
                currentRankingPage++;
                getRankingList(currentRankingType, currentRankingPage).then(rankingData => {
                    if (rankingData.length > 0) {
                        renderRankingList(rankingData, true);
                        hasMoreRanking = rankingData.length >= 15;
                    } else {
                        hasMoreRanking = false;
                    }
                }).catch(err => {
                    showToast('网络异常');
                    currentRankingPage--;
                }).finally(() => {
                    rankingLoadMore.style.display = 'none';
                    if (hasMoreRanking) {
                        loadMoreRankingBtn.style.display = 'block';
                    }
                });
            }
            
            loadMoreRankingBtn.addEventListener('click', loadMoreRanking);
            appContent.addEventListener('scroll', function() {
                clearTimeout(rankingScrollTimeout);
                rankingScrollTimeout = setTimeout(checkRankingScroll, 100);
            });
        }
        
        async function loadRankingList(type, append = false) {
            const rankingList = document.getElementById('rankingList');
            const rankingToggleBtn = document.getElementById('rankingToggleBtn');
            const rankingTitle = document.getElementById('rankingTitle');
            currentRankingType = type;
            rankingToggleBtn.textContent = type === 'money' ? '切换经验榜' : '切换金币榜';
            rankingTitle.textContent = (type === 'money' ? '金币' : '经验') + '排行榜';
            if (!append) {
                rankingList.innerHTML = '<div class="ranking-loading"><div class="loading-spinner"></div>加载中...</div>';
                currentRankingPage = 1;
                hasMoreRanking = true;
            }
            try {
                const rankingData = await getRankingList(type, currentRankingPage);
                renderRankingList(rankingData, append);
                hasMoreRanking = rankingData.length >= 15;
            } catch (error) {
                showToast('网络异常');
                if (!append) {
                    rankingList.innerHTML = '<div style="text-align: center; padding: 40px; color: #7f8c8d;">加载失败</div>';
                }
            }
        }
        
        function setupRankingTabs() {
            const rankingToggleBtn = document.getElementById('rankingToggleBtn');
            rankingToggleBtn.addEventListener('click', function() {
                if (isRankingLoading) return;
                currentRankingType = currentRankingType === 'money' ? 'exp' : 'money';
                rankingLoaded[currentRankingType] = false;
                lastRankingTypeScroll = { money: 0, exp: 0 };
                loadRankingList(currentRankingType);
                rankingLoaded[currentRankingType] = true;
            });
        }
        
        function refreshRanking() {
            if (isRankingLoading) return;
            rankingLoaded[currentRankingType] = false;
            loadRankingList(currentRankingType);
            rankingLoaded[currentRankingType] = true;
            showToast('排行榜已刷新');
        }
        
        function animateLogo() {
            const logo = document.getElementById('logo');
            const appLogo = document.getElementById('appLogo');
            const logoRect = logo.getBoundingClientRect();
            const animatedLogo = logo.cloneNode(true);
            animatedLogo.style.position = 'fixed';
            animatedLogo.style.top = `${logoRect.top}px`;
            animatedLogo.style.left = `${logoRect.left}px`;
            animatedLogo.style.width = `${logoRect.width}px`;
            animatedLogo.style.height = `${logoRect.height}px`;
            animatedLogo.style.margin = '0';
            animatedLogo.style.zIndex = '100';
            document.body.appendChild(animatedLogo);
            const targetRect = appLogo.getBoundingClientRect();
            setTimeout(() => {
                animatedLogo.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                animatedLogo.style.top = `${targetRect.top}px`;
                animatedLogo.style.left = `${targetRect.left}px`;
                animatedLogo.style.width = `${targetRect.width}px`;
                animatedLogo.style.height = `${targetRect.height}px`;
                setTimeout(() => {
                    document.getElementById('appContainer').style.display = 'flex';
                    document.getElementById('loginContainer').style.opacity = '0';
                    document.getElementById('loginContainer').style.transform = 'translateY(50px)';
                    initApp();
                    setTimeout(() => { document.body.removeChild(animatedLogo); }, 500);
                }, 800);
            }, 100);
        }
        
        function checkAutoLogin() {
            const autoLoginData = localStorage.getItem('autoLoginData');
            if (autoLoginData) {
                try {
                    const { username, password } = JSON.parse(autoLoginData);
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = password;
                    document.getElementById('autoLogin').checked = true;
                } catch (error) { localStorage.removeItem('autoLoginData'); }
            }
        }
        
        function detectSystemDarkMode() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
        
        function initDarkMode() {
            const userDarkMode = localStorage.getItem('darkMode');
            if (userDarkMode === null) {
                const systemDarkMode = detectSystemDarkMode();
                setDarkMode(systemDarkMode);
            } else {
                setDarkMode(userDarkMode === 'true');
            }
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    const systemDark = e.matches;
                    const userDarkMode = localStorage.getItem('darkMode');
                    if (userDarkMode === null) setDarkMode(systemDark);
                });
            }
        }
        
        function setDarkMode(enabled) { 
            document.body.classList.toggle('dark-mode', enabled); 
            document.getElementById('darkModeToggle').classList.toggle('active', enabled); 
            localStorage.setItem('darkMode', enabled); 
        }
        
        async function refreshCommunity() {
            const postList = document.getElementById('postList');
            const loadMore = document.getElementById('loadMore');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            postList.innerHTML = '<div style="text-align: center; padding: 20px; color: #7f8c8d;">加载中...</div>';
            loadMoreBtn.style.display = 'none';
            loadMore.style.display = 'none';
            try { 
                const { posts, hasMore } = await getPosts(1); 
                renderPosts(posts); 
                currentPage = 1; 
                hasMorePosts = hasMore; 
                if (document.getElementById('communityPage').style.display === 'block') {
                    showToast('社区内容已刷新');
                }
            }
            catch (error) { showToast('网络异常'); }
        }
        
        function setupPostModal() {
            const postModal = document.getElementById('postModal');
            const newPostBtn = document.getElementById('newPostBtn');
            const postModalClose = document.getElementById('postModalClose');
            const postModalCancel = document.getElementById('postModalCancel');
            const postModalSubmit = document.getElementById('postModalSubmit');
            
            newPostBtn.addEventListener('click', function() {
                const token = localStorage.getItem('userToken') || userToken;
                if (!token) { showToast('请先登录'); return; }
                postModal.style.display = 'flex';
                isRestoreMode = false;
            });
            
            postModalClose.addEventListener('click', function() { 
                postModal.style.display = 'none'; 
                clearPostModal();
            });
            
            postModalCancel.addEventListener('click', function() { 
                if (!isRestoreMode) {
                    const saved = localStorage.getItem('lastPostContent');
                    if (saved) {
                        try {
                            const obj = JSON.parse(saved);
                            document.getElementById('postTitle').value = obj.title || '';
                            document.getElementById('postContent').value = obj.content || '';
                            document.getElementById('postDevice').value = obj.device || '';
                            document.getElementById('postVideo').value = obj.video || '';
                            showToast('已恢复上次内容');
                            isRestoreMode = true;
                        } catch (e) { 
                            clearPostModal();
                            showToast('没有可恢复的内容，已清空');
                        }
                    } else {
                        clearPostModal();
                        showToast('没有可恢复的内容，已清空');
                    }
                } else {
                    clearPostModal();
                    showToast('内容已清空');
                    isRestoreMode = false;
                }
            });
            
            postModal.addEventListener('click', function(e) { 
                if (e.target === postModal) {
                    postModal.style.display = 'none'; 
                    clearPostModal();
                }
            });
            
            function clearPostModal() {
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postDevice').value = '';
                document.getElementById('postVideo').value = '';
                isRestoreMode = false;
                localStorage.removeItem('lastPostContent');
            }
            
            postModalSubmit.addEventListener('click', async function() {
                const sectionId = document.getElementById('postSection').value;
                const title = document.getElementById('postTitle').value.trim();
                const content = document.getElementById('postContent').value.trim();
                const device = document.getElementById('postDevice').value.trim();
                const video = document.getElementById('postVideo').value.trim();
                if (!title) { showToast('请输入标题'); return; }
                if (!content) { showToast('请输入内容'); return; }
                let suffix = ' 機型：';
                suffix += device ? device : '此帖由【漫趣（原三方小趣）】发送';
                suffix += '｜';
                if (video) {
                    let pureBv = video;
                    if (video.includes('bv/') || video.includes('BV') || video.includes('BV')) {
                        const bvMatch = video.match(/(BV[a-zA-Z0-9]{10})/i);
                        if (bvMatch) pureBv = bvMatch[1];
                    }
                    suffix += '【视频：' + pureBv + '】';
                }
                const fullContent = content + suffix;
                lastPostContent = { title: title, content: content, device: device, video: video };
                localStorage.setItem('lastPostContent', JSON.stringify(lastPostContent));
                postModalSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发布中...'; postModalSubmit.disabled = true;
                try {
                    await createPost({ title: title, content: fullContent, subsectionid: sectionId });
                    showToast('已尝试发送帖子，请查看是否成功');
                    postModal.style.display = 'none';
                    clearPostModal();
                    refreshCommunity();
                } catch (error) {
                    showToast('已尝试发送帖子，请查看是否成功');
                    postModal.style.display = 'none';
                    clearPostModal();
                    refreshCommunity();
                } finally { 
                    postModalSubmit.innerHTML = '发布'; 
                    postModalSubmit.disabled = false; 
                }
            });
        }
        
        function setupCommentForm() {
            const commentSubmit = document.getElementById('commentSubmit');
            const commentCancel = document.getElementById('commentCancel');
            const commentContent = document.getElementById('commentContent');
            const commentImageUrl = document.getElementById('commentImageUrl');
            
            commentSubmit.addEventListener('click', async function() {
                let content = commentContent.value.trim();
                const imageUrl = commentImageUrl.value.trim();
                const parentid = document.getElementById('replyParentId').value;
                if (!content) { showToast('请输入评论内容'); return; }
                if (!currentPostId) { showToast('帖子ID不存在'); return; }
                if (replyingTo) { content = `@${replyingTo.username} ${content}`; }
                commentSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发布中...'; commentSubmit.disabled = true;
                try {
                    const result = await postComment(currentPostId, content, imageUrl, parentid);
                    if (result && result.success) {
                        showToast('评论发布成功');
                        commentContent.value = ''; commentImageUrl.value = '';
                        const { comments, hasMore } = await getComments(currentPostId, 1);
                        renderComments(comments); currentCommentPage = 1; hasMoreComments = hasMore; closeCommentModal();
                    }
                } catch (error) {
                    showToast('网络异常');
                } finally { commentSubmit.innerHTML = '发表评论'; commentSubmit.disabled = false; }
            });
            
            commentCancel.addEventListener('click', function() { closeCommentModal(); });
        }
        
        function setupLikeButton() {
            const likePostBtn = document.getElementById('likePostBtn');
            likePostBtn.addEventListener('click', async function() {
                if (!currentPostId) { showToast('请先选择帖子'); return; }
                
                const currentText = likePostBtn.innerHTML;
                const isCurrentlyLiked = likePostBtn.classList.contains('liked');
                
                likePostBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
                likePostBtn.disabled = true;
                
                try {
                    const result = await likePost(currentPostId);
                    if (result && result.success) {
                        const post = await getPostDetail(currentPostId);
                        
                        if (result.is_thumbs === 1) {
                            showToast('点赞成功');
                        } else {
                            showToast('取消点赞成功');
                        }
                        
                        updateLikeButton(result.is_thumbs, post.thumbs);
                        renderPostDetail(post);
                    }
                } catch (error) { 
                    showToast('网络异常'); 
                    likePostBtn.innerHTML = currentText;
                }
                finally { 
                    likePostBtn.disabled = false;
                }
            });
        }
        
        function setupSearch() {
            const searchBtn = document.getElementById('searchBtn');
            const searchIcon = document.getElementById('searchIcon');
            const searchInput = document.getElementById('searchInputInline');
            const searchCancel = document.getElementById('searchCancel');
            
            searchBtn.addEventListener('click', function() {
                if (isSearchBarVisible) {
                    exitSearchMode();
                } else {
                    toggleSearchBar(true);
                    searchInput.focus();
                }
            });
            
            searchIcon.addEventListener('click', function() {
                performSearch();
            });
            
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            searchCancel.addEventListener('click', function() {
                exitSearchMode();
            });
            
            searchInput.setAttribute('autocomplete', 'off');
        }
        
        function setupEventBindings() {
            if (isEventBindingsSetup) return;
            isEventBindingsSetup = true;
            
            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                const autoLoginChecked = document.getElementById('autoLogin').checked;
                if (!username || !password) { showToast('请输入用户名和密码'); return; }
                showLoginStatus();
                try {
                    const res = await loginAPI(username, password);
                    if (res.success) {
                        userToken = res.token;
                        if (userToken) {
                            localStorage.setItem('userToken', userToken);
                            if (autoLoginChecked) {
                                localStorage.setItem('autoLoginData', JSON.stringify({ username, password }));
                            }
                            animateLogo();
                        } else {
                            throw new Error('登录成功但未获取到token');
                        }
                    }
                } catch (err) {
                    hideLoginStatus();
                    showToast('网络异常');
                }
            });
            
            document.getElementById('togglePassword').addEventListener('click', function() {
                const pwd = document.getElementById('password');
                if (pwd.type === 'password') { pwd.type = 'text'; this.innerHTML = '<i class="far fa-eye-slash"></i>'; }
                else { pwd.type = 'password'; this.innerHTML = '<i class="far fa-eye"></i>'; }
            });
            
            document.getElementById('appHeader').addEventListener('dblclick', function(e) {
                if (!e.target.closest('.header-buttons')) {
                    refreshCommunity();
                }
            });
            
            document.getElementById('darkModeToggle').addEventListener('click', function() {
                const isDark = document.body.classList.contains('dark-mode');
                setDarkMode(!isDark);
            });
            
            document.getElementById('backToCommunity').addEventListener('click', function() { backToCommunity(); });
            
            document.getElementById('showCommentModalBtn').addEventListener('click', function() { showCommentModal(); });
            
            document.getElementById('commentModalClose').addEventListener('click', function() { closeCommentModal(); });
            
            document.getElementById('imageModalClose').addEventListener('click', function() { closeImageModal(); });
            
            document.getElementById('forgotPassword').addEventListener('click', function(e) { 
                e.preventDefault(); 
                showToast('暂不支持，请前往小趣空间操作'); 
            });
            
            document.getElementById('registerLink').addEventListener('click', function(e) { 
                e.preventDefault(); 
                showToast('暂不支持，请前往小趣空间操作'); 
            });
            
            document.getElementById('checkinBtn').addEventListener('click', function() { signIn(); });
            
            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.removeItem('userToken'); localStorage.removeItem('autoLoginData'); userToken = null; showToast('已退出登录'); location.reload();
            });
            
            document.getElementById('changelogBtn').addEventListener('click', function() {
                window.open('http://text.kt-network.cn/ManQu_history', '_blank');
            });
            
            setupNavigation(); 
            setupPostScrollLoading(); 
            setupPostModal(); 
            setupCommentForm(); 
            setupLikeButton();
            setupRankingTabs();
            setupRankingScrollLoading();
            setupSearch();
        }
        
        function initApp() {
            setupEventBindings();
            refreshCommunity();
        }
    </script>
</body>
